<!doctype html>
<html>
  <head>
    <title>Form Data Mahasiswa</title>
    <style>
      table {
        margin-bottom: 15px;
      }
      td {
        padding: 5px;
        vertical-align: top;
      }
    </style>
    <script>
      function validasiHobi() {
        var checkboxes = document.querySelectorAll(
          'input[name="hobi"]:checked',
        );
        if (checkboxes.length !== 2) {
          alert("Pilih tepat 2 hobi yang paling disukai sebelum Submit.");
          return false;
        }
        return true;
      }
    </script>
  </head>
  <body>
    <h3>Data Mahasiswa</h3>
    <form action="#" method="POST" onsubmit="return validasiHobi();">
      <table>
        <tr>
          <td>NIM :</td>
          <td><input type="text" name="nim" required /></td>
        </tr>
        <tr>
          <td>Nama :</td>
          <td><input type="text" name="nama" required /></td>
        </tr>
        <tr>
          <td>Tgl Lahir (dd-mm-yyyy) :</td>
          <td><input type="date" name="tanggal_lahir" required /></td>
        </tr>
        <tr>
          <td>Jenis Kelamin :</td>
          <td>
            <input
              type="radio"
              name="jenis_kelamin"
              value="Laki-Laki"
              required
            />
            Laki-Laki
            <input type="radio" name="jenis_kelamin" value="Perempuan" />
            Perempuan
          </td>
        </tr>
        <tr>
          <td>Alamat :</td>
          <td><textarea name="alamat" rows="4" cols="30"></textarea></td>
        </tr>
        <tr>
          <td>Tinggal di :</td>
          <td>
            <select name="tinggal" required>
              <option value="">--pilih--</option>
              <option value="Kos/Kontrakan">Kos/Kontrakan</option>
              <option value="Rumah saudara">Rumah saudara</option>
              <option value="Rumah orang tua">Rumah orang tua</option>
            </select>
          </td>
        </tr>
        <tr>
          <td>Pilih 2 hobi yang paling disukai :</td>
          <td>
            <input type="checkbox" name="hobi" value="Science" /> Science<br />
            <input type="checkbox" name="hobi" value="Technology" />
            Technology<br />
            <input type="checkbox" name="hobi" value="Art" /> Art<br />
            <input type="checkbox" name="hobi" value="Sport" /> Sport
          </td>
        </tr>
      </table>

      <button type="submit">Submit</button>
      <button type="reset">Reset</button>
    </form>
  </body>
</html>
